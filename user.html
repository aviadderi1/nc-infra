<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>דיווח תקלת תשתית - פיקוד צפון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1410;--bg2:#16241c;--accent:#c9a227;--accent2:#e8c65a;--text:#f2f2ec;--muted:#9aa89d;--soft:#c9d2c9;
  --danger:#ff8a80;--crit:#e74c3c;--mid:#f08a24;--low:#f1c40f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg1)}
body{font-family:'Heebo',system-ui,sans-serif;color:var(--text);min-height:100dvh;
  background:radial-gradient(ellipse at 30% 0%,#223a2c 0%,var(--bg2) 45%,var(--bg1) 100%) fixed}
button,input,select,textarea{font-family:inherit}
.logo{width:100%;height:100%;display:block}

/* splash */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:24px;background:inherit;transition:opacity .5s}
#splash.done{opacity:0;pointer-events:none}
#splash{animation:splashOut .5s 2.3s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.sp-bar{animation:spFill 2s linear forwards}
@keyframes spFill{to{width:100%}}
.nojs{background:#3a1d14;border:1px solid #ff8a80;color:#ffd6d0;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;margin:14px 16px 0}
#splash .lg{width:112px;height:112px;animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
#splash h1{text-align:center;font-size:24px;font-weight:800;line-height:1.3;animation:fadeUp .8s .2s both}
#splash h1 span{display:block;color:var(--accent2)}
.sp-track{width:min(280px,80%);height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;animation:fadeUp .8s .4s both}
.sp-bar{height:100%;width:0;background:linear-gradient(270deg,var(--accent2),var(--accent));border-radius:inherit}

/* header */
.hd{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:max(12px,env(safe-area-inset-top));background:rgba(11,20,16,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,162,39,.35)}
.hd .lg{width:40px;height:40px;flex:none}
.hd .t1{font-size:17px;font-weight:500}
.hd .t2{font-size:12px;color:var(--muted)}

/* form */
main{max-width:560px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.f{margin-bottom:18px}
.l{display:block;font-size:15px;color:var(--soft);margin-bottom:7px}
.l b{color:var(--accent2);font-weight:500}
.in{width:100%;height:50px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;
  color:var(--text);font-size:16px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.in::placeholder{color:#6f7d72}
.in:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(232,198,90,.18)}
.in.bad{border-color:var(--danger)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:16px 50%,22px 50%;background-size:6px 6px;background-repeat:no-repeat}
select.in option{background:#16241c;color:var(--text)}
input[type=date].in{color-scheme:dark}
textarea.in{height:120px;padding:12px 14px;resize:vertical;line-height:1.6}
.err{color:var(--danger);font-size:13px;min-height:16px;margin-top:5px}
.sev{display:flex;flex-direction:column;gap:10px}
.sev label{display:flex;align-items:center;gap:12px;text-align:right;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 14px;color:var(--text);font-size:15px;line-height:1.4;cursor:pointer;transition:.15s}
.sev .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.sev .nm{font-weight:500}
.sev label:has(input:checked),.sev label.on{border-width:2px;padding:12px 13px;background:rgba(255,255,255,.07);border-color:var(--c)}
.sev label:has(input:checked) .dot,.sev label.on .dot{box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.sev label:has(input:focus-visible){outline:2px solid var(--accent2);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.photo{display:block;border:1px dashed rgba(255,255,255,.25);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;position:relative}
.photo svg{width:28px;height:28px;color:var(--accent2)}
.photo img{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto 10px}
.photo .acts{display:flex;gap:8px;justify-content:center}
.photo .chg{background:transparent;border:1px solid rgba(232,198,90,.5);color:var(--accent2);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
#sheetToggle:checked + .sheet{opacity:1;pointer-events:auto}
.sheet-bg{position:absolute;inset:0;cursor:pointer}
.sheet .pnl{position:relative}
.sheet .pnl{width:100%;max-width:560px;background:#1a2a21;border-top:1px solid rgba(232,198,90,.35);border-radius:20px 20px 0 0;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
#sheetToggle:checked + .sheet .pnl{transform:none}
.sheet .op,.sheet .cn{display:flex;-webkit-user-select:none;user-select:none}
.sheet .cn{justify-content:center}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet .ttl{text-align:center;color:var(--muted);font-size:15px;margin-bottom:12px}
.sheet .op{width:100%;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:15px;color:var(--text);font-size:17px;text-align:right;cursor:pointer;margin-bottom:10px}
.sheet .op:active{background:rgba(232,198,90,.12)}
.sheet .op svg{width:28px;height:28px;color:var(--accent2);flex:none}
.sheet .op small{display:block;font-size:12px;color:var(--muted)}
.sheet .cn{width:100%;background:transparent;border:none;color:var(--muted);font-size:16px;padding:12px;cursor:pointer}
.photo .rm{background:transparent;border:1px solid rgba(255,138,128,.5);color:var(--danger);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.go{width:100%;height:54px;background:var(--accent);color:#1a1405;border:none;border-radius:14px;font-size:18px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .2s,transform .1s;margin-top:6px}
.go:active{transform:scale(.98)}
.go svg{width:20px;height:20px}
.go[disabled]{opacity:.6}

/* success */
.done-box{text-align:center;padding-top:9vh;animation:fadeUp .5s both}
.done-box .ok{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:rgba(93,202,165,.15);display:flex;align-items:center;justify-content:center}
.done-box .ok svg{width:40px;height:40px;color:#5DCAA5}
.fnum-box{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(93,202,165,.1);border:1px solid rgba(127,220,184,.45);border-radius:14px;padding:12px;margin:0 auto 18px;max-width:280px}
.fnum-box span{font-size:12px;color:var(--muted)}
.fnum-box b{font-size:26px;font-weight:800;color:#7fdcb8;direction:ltr;letter-spacing:.02em}
.done-box h2{font-size:24px;font-weight:500;margin-bottom:10px}
.done-box .sum{color:var(--muted);font-size:15px;line-height:1.9;margin-bottom:30px}

@keyframes logoIn{from{opacity:0;transform:scale(.7) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#splash{animation-duration:.01s}}

<main>
<form id="form" novalidate>
  <div class="f"><label class="l" for="role">1. תפקיד המדווח <b>*</b></label>
    <input class="in" id="role" placeholder="לדוגמה: מפקד מוצב / קצין אג״ם" autocomplete="organization-title">
    <div class="err" data-for="role"></div></div>

  <div class="f"><label class="l" for="phone">2. טלפון נייד <b>*</b></label>
    <input class="in" id="phone" type="tel" inputmode="tel" placeholder="05X-XXXXXXX" autocomplete="tel" dir="ltr" style="text-align:right" maxlength="14">
    <div class="err" data-for="phone"></div></div>

  <div class="f"><label class="l" for="division">3. גזרה <b>*</b></label>
    <select class="in" id="division"><option value="">בחר גזרה</option>
      <option>אוגדה 91</option><option>אוגדה 36</option><option>אוגדה 210</option></select>
    <div class="err" data-for="division"></div></div>

  <div class="f"><label class="l" for="brigade">4. חטיבה <b>*</b></label>
    <div id="briWrap"><input class="in" id="brigade" placeholder="שם או מספר החטיבה" autocomplete="off"></div>
    <div class="err" data-for="brigade"></div></div>

  <div class="f"><label class="l" for="type">5. סוג התשתית <b>*</b></label>
    <select class="in" id="type"><option value="">בחר סוג תשתית</option>
      <option>מוצב</option><option>ציר</option><option>מכשול</option><option value="מעבר">מעברים</option><option>בסיס אש</option>
      <option>תשתית רציפות תפקודית</option><option>מיגון</option><option>אחר</option></select>
    <div class="err" data-for="type"></div></div>

  <div class="f"><label class="l" for="name">6. שם התשתית <b>*</b></label>
    <input class="in" id="name" placeholder="שם המוצב / הציר / המתקן" autocomplete="off">
    <div class="err" data-for="name"></div></div>


  <div class="f"><span class="l">7. סיווג התקלה <b>*</b></span>
    <div class="sev" id="sev" role="radiogroup" aria-label="סיווג התקלה">
      <label style="--c:var(--crit)"><input type="radio" name="sev" value="3" class="vh"><span class="dot" style="background:var(--crit)"></span>
        <span><span class="nm" style="color:#ff8a80">קריטית</span> – פגיעה ברציפות התפקוד או בבטיחות</span></label>
      <label style="--c:var(--mid)"><input type="radio" name="sev" value="2" class="vh"><span class="dot" style="background:var(--mid)"></span>
        <span><span class="nm" style="color:#f5b06a">בינונית</span> – פגיעה חלקית בתפקוד התשתית</span></label>
      <label style="--c:var(--low)"><input type="radio" name="sev" value="1" class="vh"><span class="dot" style="background:var(--low)"></span>
        <span><span class="nm" style="color:#f1d36a">נמוכה</span> – תקלה שאינה פוגעת בתפקוד השוטף</span></label>
    </div>
    <div class="err" data-for="sev"></div></div>

  <div class="f"><label class="l" for="details">8. פירוט התקלה <b>*</b></label>
    <textarea class="in" id="details" placeholder="תאר בקצרה את התקלה, מה נפגע ומה המשמעות שלה"></textarea>
    <div class="err" data-for="details"></div></div>

  <div class="f"><span class="l">9. תמונת התקלה</span>

  <div class="err" id="saveErr" style="text-align:center"></div>

</div>

<script>
const SPLASH_MS=2000;
const fbReady = new Promise((res,rej)=>{ window.__fbResolve=res; window.__fbReject=rej; setTimeout(()=>rej(new Error('timeout')),20000); });
fbReady.catch(()=>{});
const withTimeout = (p,ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const SEV_NAME={3:'קריטית',2:'בינונית',1:'נמוכה'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let severity=null, photoData=null;

/* splash */
(function(){const bar=$('#spBar');let t0=null;
  const step=t=>{if(t0===null)t0=t;const p=Math.min((t-t0)/SPLASH_MS,1);bar.style.width=p*100+'%';
    if(p<1)requestAnimationFrame(step);else{$('#splash').classList.add('done');setTimeout(()=>$('#splash').remove(),600);}};
  requestAnimationFrame(step);})();

/* divisions and brigades come from the structure table (managed in the dashboard) */
let STRUCT=[];
const LS_LAST='nc_last_unit', LS_PHONE='nc_phone';
const phoneOk = v => /^0\d{8,9}$/.test(v.replace(/[\s-]/g,''));
try{ const ph=localStorage.getItem(LS_PHONE); if(ph) document.getElementById('phone').value=ph; }catch(_){}
function renderDivs(){
  if(!STRUCT.length) return;
  const cur=$('#division').value;
  $('#division').innerHTML='<option value="">בחר גזרה</option>'+STRUCT.map(d=>`<option ${d.name===cur?'selected':''}>${esc(d.name)}</option>`).join('');
}
function renderBri(keep){
  const d=STRUCT.find(x=>x.name===$('#division').value), list=d?.brigades||[];
  const old=keep!==undefined?keep:($('#brigade')?.value||'');
  $('#briWrap').innerHTML = list.length
    ? `<select class="in" id="brigade"><option value="">בחר חטיבה</option>${list.map(b=>`<option ${b===old?'selected':''}>${esc(b)}</option>`).join('')}</select>`
    : `<input class="in" id="brigade" placeholder="${$('#division').value?'שם או מספר החטיבה':'בחר קודם גזרה'}" autocomplete="off" value="${esc(old)}">`;
  $('#brigade').addEventListener('input',()=>setErr('brigade',''));
  $('#brigade').addEventListener('change',()=>setErr('brigade',''));
}
$('#division').addEventListener('change',()=>{ renderBri(''); setErr('division',''); });
try{ const l=JSON.parse(localStorage.getItem(LS_LAST)||'null'); if(l){ $('#division').value=l.division||''; renderBri(l.brigade||''); } }catch(_){}
fbReady.then(api=>api.structure()).then(list=>{
  STRUCT=list||[]; if(!STRUCT.length) return;
  let l=null; try{ l=JSON.parse(localStorage.getItem(LS_LAST)||'null'); }catch(_){}
  renderDivs(); if(l && STRUCT.some(d=>d.name===l.division)) $('#division').value=l.division;
  renderBri(l?.brigade||'');
}).catch(()=>{});

/* fault number shown to the reporter */
const fnum=(seq,iso)=>`NC-${(iso||new Date().toISOString()).slice(0,4)}-${String(seq).padStart(4,'0')}`;

/* severity */
function syncSev(){
  const r=document.querySelector('input[name=sev]:checked');severity=r?+r.value:null;
  document.querySelectorAll('#sev label').forEach(l=>l.classList.toggle('on',!!l.querySelector('input:checked')));
}
$('#sev').addEventListener('change',()=>{syncSev();setErr('sev','');});

/* photo: resized to keep storage small */
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
function renderPhoto(){
  $('#photo').innerHTML = photoData
    ? `<img src="${photoData}" alt="תמונת התקלה"><div class="acts"><button type="button" class="chg" id="chgPhoto">החלף תמונה</button><button type="button" class="rm" id="rmPhoto">הסר</button></div>`
    : `${CAM}<div style="margin-top:6px">הוסף תמונה</div>`;
}
renderPhoto();
const openSheet=()=>{$('#sheetToggle').checked=true;};
const closeSheet=()=>{$('#sheetToggle').checked=false;};
$('#photo').addEventListener('click',e=>{
  if(e.target.id==='rmPhoto'){e.preventDefault();photoData=null;renderPhoto();return;}
  if(e.target.id==='chgPhoto'){e.preventDefault();openSheet();return;}
  if(photoData){e.preventDefault();}   /* tapping the preview itself does nothing */
});
$('#photo').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet();}});
['#optCam','#optGal'].forEach(sel=>$(sel).addEventListener('click',()=>{const inp=$(sel==='#optCam'?'#fileCam':'#fileGal');inp.value='';}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
['#fileCam','#fileGal'].forEach(sel=>$(sel).addEventListener('change',()=>{closeSheet();loadPhoto($(sel).files[0]);}));
function loadPhoto(f){
  if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const max=1000,k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);renderPhoto();};
  img.onerror=()=>{URL.revokeObjectURL(url);setErr('saveErr','לא ניתן לקרוא את התמונה');};
  img.src=url;
}

/* validation */
function setErr(id,msg){
  const el=id==='saveErr'?$('#saveErr'):document.querySelector(`.err[data-for="${id}"]`);if(el)el.textContent=msg;
  const inp=document.getElementById(id);if(inp&&inp.classList.contains('in'))inp.classList.toggle('bad',!!msg);
}
['role','phone','division','type','name','details'].forEach(id=>$('#'+id).addEventListener('input',()=>setErr(id,'')));

$('#form').addEventListener('submit',async e=>{
  e.preventDefault();setErr('saveErr','');
  const v=id=>$('#'+id).value.trim();
  const req={role:'הזן את תפקיד המדווח',phone:'הזן מספר טלפון לחזרה',division:'בחר גזרה',brigade:'בחר חטיבה',type:'בחר סוג תשתית',name:'הזן את שם התשתית',details:'תאר את התקלה'};
  let first=null;
  for(const id in req){if(!v(id)){setErr(id,req[id]);first=first||id;}}
  if(v('phone') && !phoneOk(v('phone'))){setErr('phone','מספר טלפון לא תקין');first=first||'phone';}
  if(!severity){setErr('sev','בחר סיווג תקלה');first=first||'sev';}
  const order=['role','phone','division','brigade','type','name','sev','details']; if(first) first=order.find(k=>document.querySelector(`.err[data-for="${k}"]`)?.textContent)||first;
  if(first){(document.getElementById(first)||$('#sev')).scrollIntoView({behavior:'smooth',block:'center'});return;}

  if(!navigator.onLine){ setErr('saveErr','אין חיבור לאינטרנט. התחבר ונסה שוב, הטופס נשמר על המסך.'); return; }
  const report={role:v('role'),phone:v('phone').replace(/[\s-]/g,''),division:v('division'),brigade:v('brigade').replace(/\s+/g,' '),family:v('type'),infraName:v('name').replace(/\s+/g,' '),
    severity,details:v('details'),photo:photoData,status:'received',createdAt:new Date().toISOString()};
  const btn=$('#send'), label=btn.innerHTML; btn.disabled=true; btn.textContent='שולח…';
  try{
    const api = await withTimeout(fbReady,15000);
    report.seq = await withTimeout(api.send(report), 25000);
    try{ localStorage.setItem(LS_LAST,JSON.stringify({division:report.division,brigade:report.brigade})); localStorage.setItem(LS_PHONE,report.phone); }catch(_){}
    showDone(report);
  }catch(err){
    const c=err?.code||err?.message||'';
    setErr('saveErr', /timeout|network|unavailable/.test(c) ? 'אין חיבור לשרת. בדוק את הקליטה ונסה שוב, הטופס נשמר על המסך.'
      : /permission/.test(c) ? 'השרת דחה את הדיווח. ייתכן שהתמונה גדולה מדי, נסה בלי תמונה.'
      : /admin-restricted|operation-not-allowed/.test(c) ? 'שליחה אנונימית לא הופעלה בשרת. פנה למנהל המערכת.'
      : /unauthorized-domain|operation-not-supported/.test(c) ? 'יש לפתוח את הטופס מהקישור הרשמי ולא מקובץ.'
      : 'הדיווח לא נשלח. נסה שוב.');
  }finally{ btn.disabled=false; btn.innerHTML=label; }
});

function showDone(r,note){
  $('#form').hidden=true;
  $('#done').innerHTML=`<div class="done-box">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg></div>
    <h2>הדיווח נשלח</h2>
    <div class="fnum-box"><span>מספר התקלה שלך</span><b>${fnum(r.seq,r.createdAt)}</b><span>שמור את המספר לבירורים</span></div>
    <div class="sum">${esc(r.family)} · ${esc(r.infraName)}<br>${esc(r.division)} · ${esc(r.brigade||'')} · תקלה <b style="color:${{3:'#ff8a80',2:'#f5b06a',1:'#f1d36a'}[r.severity]};font-weight:500">${SEV_NAME[r.severity]}</b>
    ${note?`<br><span style="color:var(--danger);font-size:13px">${esc(note)}</span>`:''}</div>
    <button class="go" id="again">דיווח חדש</button></div>`;
  $('#done').hidden=false;window.scrollTo(0,0);
  $('#again').onclick=resetForm;
}
function resetForm(){
  const keepPhone=$('#phone').value, keepRole=$('#role').value,keepDiv=$('#division').value,keepBri=$('#brigade').value;
  $('#form').reset();$('#role').value=keepRole;$('#phone').value=keepPhone;$('#division').value=keepDiv;renderBri(keepBri);
  severity=null;photoData=null;renderPhoto();
  syncSev();
  $('#done').hidden=true;$('#form').hidden=false;window.scrollTo(0,0);
}
</script>
<script type="module">
const V='10.14.1';
try{
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const S = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp({
  apiKey: "AIzaSyDGBWJ6D2uSFEeJf9Zh5mcXDxRCekx7Wus",
  authDomain: "itamar-7c8ac.firebaseapp.com",
  projectId: "itamar-7c8ac",
  storageBucket: "itamar-7c8ac.firebasestorage.app",
  messagingSenderId: "1000938553580",
  appId: "1:1000938553580:web:f8b84a4b2175daf42625c9"
});
  const auth = A.getAuth(app), db = S.getFirestore(app);
  window.__fbResolve({
    structure: async () => (await S.getDocs(S.collection(db,'structure'))).docs.map(d=>d.data()).sort((a,b)=>(a.order||0)-(b.order||0)),
    send: async data => {
      if(!auth.currentUser) await A.signInAnonymously(auth);
      const cRef=S.doc(db,'meta','counter'), fRef=S.doc(S.collection(db,'faults'));
      return await S.runTransaction(db, async tx => {
        const c=await tx.get(cRef), n=(c.exists()?c.data().n:0)+1;
        tx.set(cRef,{ n, lastId:fRef.id });
        tx.set(fRef,{ ...data, seq:n, serverTime:S.serverTimestamp() });
        return n;
      });
    }
  });
}catch(e){ console.error('Firebase failed to load', e); window.__fbReject && window.__fbReject(e); }
</script>
